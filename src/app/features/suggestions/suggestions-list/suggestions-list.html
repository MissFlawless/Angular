<!-- src/app/core/list-suggestion/list-suggestion.component.html -->
<div class="suggestion-container">
  <div class="header-actions">
    <h2>Liste des suggestions</h2>
    <button routerLink="/suggestions/add">+ Ajouter suggestion</button>
  </div>

  <div *ngFor="let s of suggestions" class="suggestion-card">
    <div class="suggestion-header">
      <h3>{{ s.title }}</h3>
      <span class="status-badge" [ngClass]="s.status">
        {{ s.status | titlecase }}
      </span>
    </div>

    <p>{{ s.description }}</p>
    <button [routerLink]="[s.id]">Voir détails</button>
  </div>
</div>
