
<div class="suggestion-container">
  <h2>Liste des suggestions</h2>

  <div *ngFor="let s of suggestions" class="suggestion-card">
    <div class="suggestion-header">
      <h3>{{ s.title }}</h3>
      <span class="status-badge" [ngClass]="s.status">{{ s.status | titlecase }}</span>
    </div>

    <p>{{ s.description }}</p>

    <button [routerLink]="[s.id]">Voir détails</button>
  </div>
</div>
